services:
  casosex-web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: casosex-web
    ports:
      - "8086:4321"
    environment:
      - NODE_ENV=development
      - PORT=4321
      - HOST=0.0.0.0
      - WRANGLER_SEND_METRICS=false
      - CI=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/self-essentials/emdash-main/node_modules
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
